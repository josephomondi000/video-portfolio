*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;line-height:1.4}
main{max-width:1280px;margin:auto;padding:24px 16px 80px}
a{color:#fff}
h1{font-size:2rem;margin:8px 0 12px}
nav a{margin-right:18px;display:inline-block;margin-bottom:6px}
h2{font-size:1.7rem;margin:64px 0 4px;border-bottom:1px solid #444;padding-bottom:8px}
h3{font-size:1.35rem;margin:44px 0 0;color:#ddd}
h4{font-size:1rem;margin:24px 0 10px;color:#fff}
h4 span{color:#888;font-weight:400;margin-left:6px}
.colhead{color:#999;font-size:.9rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 14px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.reels{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:36px;align-items:start}
.split .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.split .grid.tall{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.play{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#1a1a1a center/cover no-repeat;cursor:pointer;color:#fff}
.v .play{aspect-ratio:9/16}
.play::before{content:"\25B6";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;background:rgba(0,0,0,.25)}
.play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#000}
.card h5{font-size:.92rem;font-weight:500;margin:8px 0 2px}
.card small a{color:#888;font-size:.8rem}
.iframely-embed{margin:0 auto;width:100%}
.iframely-responsive{position:relative;height:0;overflow:hidden}
.iframely-responsive>*{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
@media (max-width:900px){.split{grid-template-columns:1fr}}
</style>

/* =====================================================================
   HOW TO EDIT THIS PAGE
   ---------------------------------------------------------------------
   Everything on the page comes from the two lists below: YOUTUBE and
   REELS. The menu at the top builds itself from them. Page order is the
   order of the lists.

   FINDING A VIDEO ID
   - YouTube: the part after v= in youtube.com/watch?v=ID,
              or after /shorts/ in youtube.com/shorts/ID
              or after youtu.be/
   - Instagram: the part after /reel/ in instagram.com/reel/ID/
   - Facebook: the number after /reel/ in facebook.com/reel/NUMBER

   ADD A YOUTUBE VIDEO TO AN EXISTING GROUP
   Find the group, then add a line to its long: [...] list (long form)
   or its shorts: [...] list (shorts):
        ['VIDEO_ID', 'Video title'],
   Keep the comma at the end of the line. If the title has an
   apostrophe, write it as \'   (example: 'Joseph\'s reel')

   ADD A NEW GROUP INSIDE A SECTION (example: a new podcast)
   Add this inside the section's groups: [ ... ] list:
        { name:'Group name', long:[ ['VIDEO_ID','Title'] ], shorts:[ ] },

   ADD A NEW SECTION (example: Motion graphics or 3D)
   Add this block to the YOUTUBE list, in the position you want it to
   appear on the page. Use split:true to show long form and shorts

        {

            { name:'', long:[ ['VIDEO_ID','Title'] ], shorts:[ ['VIDEO_ID','Title'] ] }
          ]
        },

const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const PLAT = {i:'Instagram', f:'Facebook', fw:'Facebook'};

function ytCard(id,title,short){
  const link = (short ? 'https://www.youtube.com/shorts/' : 'https://www.youtube.com/watch?v=') + id;
  return `<article class="card${short?' v':''}">
    <button class="play" data-id="${id}" aria-label="Play: ${esc(title)}" style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)"></button>
    <h5>${esc(title)}</h5><small><a href="${link}" target="_blank" rel="noopener">Open on YouTube</a></small></article>`;
}

function reelCard(t,id,title){
  const link = t==='i' ? 'https://www.instagram.com/reel/'+id+'/' : 'https://www.facebook.com/reel/'+id+'/';
  let media = '';
  if(t==='i'){
    media = `<blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/${id}/" data-instgrm-version="14" style="background:#FFF;border:0;border-radius:3px;margin:1px;max-width:658px;min-width:326px;padding:0;width:calc(100% - 2px)"></blockquote>`;
  } else if(!NOEMBED.has(id)){
    const r = RATIO[id] || (t==='f' ? ['177.6316%','56vh'] : ['56.3406%','']);
    const u = 'https://iframely.net/api/iframe?url='+encodeURIComponent('https://www.facebook.com/reel/'+id)+'&key='+IFKEY;
    media = `<div class="iframely-embed"${r[1]?` style="max-width:${r[1]}"`:''}><div class="iframely-responsive" style="padding-bottom:${r[0]}"><a href="https://www.facebook.com/reel/${id}" data-iframely-url="${u}"></a></div></div>`;
  }
  return `<article class="card">${media}<h5>${esc(title)}</h5><small><a href="${link}" target="_blank" rel="noopener">Open on ${PLAT[t]}</a></small></article>`;
}

function ytGroup(g, split){
  const L = g.long||[], S = g.shorts||[];
  const head = g.name ? `<h4>${esc(g.name)}<span>${L.length+S.length}</span></h4>` : '';
  const longHtml = L.map(i=>ytCard(i[0],i[1],false)).join('');
  const shortHtml = S.map(i=>ytCard(i[0],i[1],true)).join('');
  if(split && L.length && S.length){
    return head + `<div class="split">
      <div><div class="colhead">Long form</div><div class="grid">${longHtml}</div></div>
      <div><div class="colhead">Shorts</div><div class="grid tall">${shortHtml}</div></div></div>`;
  }
  return head
    + (L.length ? `<div class="grid">${longHtml}</div>` : '')
    + (S.length ? `<div class="colhead" style="margin-top:14px">Shorts</div><div class="grid tall">${shortHtml}</div>` : '');
}

});

document.addEventListener('click',e=>{
  const b=e.target.closest('button.play'); if(!b||b.querySelector('iframe')) return;
  const f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.id+'?autoplay=1&rel=0';
  f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true;
  b.appendChild(f);
});
