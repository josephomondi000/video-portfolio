.play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#000}
.card h5{font-size:.92rem;font-weight:500;margin:8px 0 2px}

/* ---------- rendering ---------- */
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAT = {y:'YouTube', i:'Instagram', f:'Facebook', fw:'Facebook'};

function card(t,id,title,vertical){
  const yt = t==='y';
  const style = yt ? ` style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)"` : '';
  const link = yt ? 'https://www.youtube.com/watch?v='+id
    : t==='i' ? 'https://www.instagram.com/reel/'+id+'/' : 'https://www.facebook.com/reel/'+id+'/';
  return `<article class="card${vertical?' v':''}">
    <button class="play${yt?'':' tile'}" data-t="${t}" data-id="${id}" data-plat="${PLAT[t]}" aria-label="Play: ${esc(title)}"${style}></button>
    <h5>${esc(title)}</h5><small><a href="${link}" target="_blank" rel="noopener">Open on ${PLAT[t]}</a></small></article>`;
}

function section(groups, kind){
  return groups.map(g=>{
    const tall = kind==='shorts' || (kind==='reels' && g.items.every(i=>i[0]!=='fw'));
    const cards = g.items.map(i=> kind==='reels' ? card(i[0],i[1],i[2], i[0]!=='fw') : card('y',i[0],i[1], kind==='shorts')).join('');
    return `<h4>${esc(g.name)}<span>${g.items.length}</span></h4><div class="grid${tall?' tall':''}">${cards}</div>`;
  }).join('');
}

document.getElementById('out').innerHTML =
  `<h2 id="youtube">YouTube</h2><h3>Long form</h3>${section(LONG,'long')}
   <h3>Shorts</h3>${section(SHORTS,'shorts')}
   <h2 id="reels">Reels</h2>${section(REELS,'reels')}`;

/* load the player only when clicked */
document.addEventListener('click',e=>{
  const b=e.target.closest('button.play'); if(!b||b.querySelector('iframe')) return;
  const t=b.dataset.t,id=b.dataset.id;
  const src = t==='y' ? 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0'
    : t==='i' ? 'https://www.instagram.com/reel/'+id+'/embed/'
    : 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent('https://www.facebook.com/reel/'+id)+'&show_text=false&autoplay=true';
  const f=document.createElement('iframe');
  f.src=src; f.allow='autoplay; encrypted-media; picture-in-picture; clipboard-write'; f.allowFullscreen=true;
  b.appendChild(f);
});
