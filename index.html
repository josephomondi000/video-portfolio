<style>
:root{
  --paper:#E9EFEE; --ink:#10303A; --sea:#1F6F78; --mist:#C9D9D8; --saffron:#F0B13A; --card:#F7FAF9; --mut:#4F6A70;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1240px;margin:auto;padding:0 20px}

/* Hero: contour-map backdrop */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#EAF3F2;padding:56px 0 64px}
.hero::before{content:"";position:absolute;inset:-20%;
  background:
   repeating-radial-gradient(circle at 78% 30%,transparent 0 26px,rgba(240,177,58,.16) 26px 27px),
   repeating-radial-gradient(circle at 12% 95%,transparent 0 34px,rgba(201,217,216,.10) 34px 35px);
  pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,5.4rem);line-height:.96;letter-spacing:-.03em;margin:0 0 18px}
.hero p{max-width:34ch;font-size:1.25rem;color:#C9D9D8;margin:0 0 26px}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.skills li{font-family:var(--display);font-weight:500;font-size:.9rem;padding:6px 14px;border:1px solid rgba(233,239,238,.4);border-radius:99px}
.feature{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 6px rgba(240,177,58,.9)}
.feature .play{border-radius:0}
.feature-cap{margin-top:16px;font-size:.95rem;color:#C9D9D8}

/* Sticky filter bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(233,239,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--mist)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .92rem var(--display);color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip:hover{background:var(--mist)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.plat .chip{border-color:var(--sea);color:var(--sea)}
.plat .chip[aria-pressed="true"]{background:var(--sea);color:#fff}

/* Sections */
section.cat{padding:56px 0 8px}
.cat-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38ch);gap:12px 40px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}
.cat-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4vw,3rem);letter-spacing:-.02em;line-height:1;margin:0}
.cat-head p{margin:0;color:var(--mut)}
.group{margin-top:34px}
.group h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.group h3::before{content:"";width:22px;height:4px;background:var(--saffron);border-radius:2px}
.group h3 span{font-weight:500;color:var(--mut);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.play{position:relative;display:block;width:100%;padding:0;border:0;cursor:pointer;border-radius:8px;overflow:hidden;
  aspect-ratio:16/9;background:var(--ink) center/cover no-repeat;color:#fff}
.tall .play,.card.v .play{aspect-ratio:9/16}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(16,48,58,.55),transparent 55%)}
.play .btn{position:absolute;z-index:1;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--saffron);display:grid;place-items:center;transition:transform .15s}
.play .btn::before{content:"";margin-left:3px;border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
.play:hover .btn{transform:scale(1.12)}
.play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#000}
.play.tile{background:linear-gradient(150deg,var(--sea),var(--ink))}
.play.tile .tag{position:absolute;z-index:1;top:12px;left:12px;font:600 .85rem var(--display);padding:3px 10px;border-radius:99px;background:rgba(233,239,238,.18)}
.card h4{font:500 1rem/1.3 var(--body);margin:0}
.card .src{font:500 .82rem var(--display);color:var(--mut)}
.card .src a{text-decoration:none;border-bottom:1px solid var(--mist)}
.card .src a:hover{border-color:var(--ink)}
.empty{padding:34px;border:2px dashed var(--sea);border-radius:10px;color:var(--mut);margin-top:26px}
.hidden{display:none!important}
footer{margin-top:72px;background:var(--ink);color:#C9D9D8;padding:36px 0;font-size:.95rem}
footer strong{font-family:var(--display);color:#fff}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr}
  .cat-head{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const PLATFORM = {y:'YouTube', s:'YouTube', i:'Instagram', f:'Facebook', fw:'Facebook'};
const FEATURED = 'jAtJ0dpWxC4';

/* ---------- helpers ---------- */
const el = (tag, attrs={}, html='') => { const n=document.createElement(tag); for(const k in attrs) n.setAttribute(k,attrs[k]); n.innerHTML=html; return n; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function embedSrc(t,id){
  if(t==='y'||t==='s') return 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';
  if(t==='i') return 'https://www.instagram.com/reel/'+id+'/embed/';
  return 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent('https://www.facebook.com/reel/'+id)+'&show_text=false&autoplay=true';
}
function openUrl(t,id){
  if(t==='y'||t==='s') return 'https://www.youtube.com/watch?v='+id;
  if(t==='i') return 'https://www.instagram.com/reel/'+id+'/';
  return 'https://www.facebook.com/reel/'+id+'/';
}

function card(item){
  const [t,id,title] = item, plat = PLATFORM[t], isYT = (t==='y'||t==='s');
  const vertical = (t==='s'||t==='i'||t==='f');
  const c = el('article','card'.length?{class:'card'+(vertical?' v':''),'data-platform':plat}:{});
  const b = el('button',{class:'play'+(isYT?'':' tile'),'data-t':t,'data-id':id,'aria-label':'Play: '+title},
    (isYT?'':'<span class="tag">'+plat+'</span>')+'<span class="btn"></span>');
  if(isYT) b.style.backgroundImage = 'url(https://i.ytimg.com/vi/'+id+'/hqdefault.jpg)';
  c.appendChild(b);
  c.appendChild(el('h4',{},esc(title)));
  c.appendChild(el('div',{class:'src'},'<a href="'+openUrl(t,id)+'" target="_blank" rel="noopener">Open on '+plat+'</a>'));
  return c;
}

/* ---------- build ---------- */
const main = document.getElementById('main'), catsBox = document.getElementById('cats'), platsBox = document.getElementById('plats');
let cat='all', plat='all';

function makeChip(box,label,val,count,handler){
  const b = el('button',{class:'chip','aria-pressed':val==='all'?'true':'false','data-v':val}, esc(label)+(count!=null?'<small>'+count+'</small>':''));
  b.onclick = ()=>handler(val,b);
  box.appendChild(b);
}

let total = DATA.reduce((n,s)=>n+s.groups.reduce((m,g)=>m+g.items.length,0),0);
makeChip(catsBox,'All work','all',total,setCat);

DATA.forEach(sec=>{
  const count = sec.groups.reduce((m,g)=>m+g.items.length,0);
  makeChip(catsBox,sec.name,sec.id,count,setCat);

  const s = el('section',{class:'cat',id:sec.id,'data-cat':sec.id});
  s.appendChild(el('div',{class:'cat-head'},'<h2>'+esc(sec.name)+'</h2><p>'+esc(sec.blurb)+'</p>'));
  if(!sec.groups.length){
    s.appendChild(el('div',{class:'empty'},'3D work goes here. Add items to this section in the DATA list at the top of the script.'));
  }
  sec.groups.forEach(g=>{
    const grp = el('div',{class:'group'});
    grp.appendChild(el('h3',{},esc(g.name)+' <span>'+g.items.length+'</span>'));
    const allVertical = g.items.every(i=>i[0]==='s'||i[0]==='i'||i[0]==='f');
    const grid = el('div',{class:'grid'+(allVertical?' tall':'')});
    g.items.forEach(i=>grid.appendChild(card(i)));
    grp.appendChild(grid);
    s.appendChild(grp);
  });
  main.appendChild(s);
});

['all','YouTube','Instagram','Facebook'].forEach(p=>makeChip(platsBox,p==='all'?'All platforms':p,p,null,setPlat));

function setChip(box,btn){ box.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===btn?'true':'false')); }
function setCat(v,b){ cat=v; setChip(catsBox,b); apply(); window.scrollTo({top:document.querySelector('.bar').offsetTop,behavior:'smooth'}); }
function setPlat(v,b){ plat=v; setChip(platsBox,b); apply(); }

function apply(){
  document.querySelectorAll('section.cat').forEach(s=>{
    let any=false;
    s.querySelectorAll('.group').forEach(g=>{
      let n=0;
      g.querySelectorAll('.card').forEach(c=>{
        const show = plat==='all' || c.dataset.platform===plat;
        c.classList.toggle('hidden',!show); if(show) n++;
      });
      g.classList.toggle('hidden',n===0);
      if(n) any=true;
    });
    const isEmptySection = !s.querySelector('.group');
    const catOk = cat==='all' || s.dataset.cat===cat;
    // empty sections (3D) only show when no platform filter and category is all or 3d
    s.classList.toggle('hidden', !catOk || (isEmptySection ? plat!=='all' : !any));
  });
}

/* ---------- click to load ---------- */
function load(btn){
  if(btn.querySelector('iframe')) return;
  const f = el('iframe',{src:embedSrc(btn.dataset.t,btn.dataset.id),allow:'autoplay; encrypted-media; picture-in-picture; clipboard-write',allowfullscreen:'',title:btn.getAttribute('aria-label')});
  btn.appendChild(f);
}
document.addEventListener('click',e=>{ const b=e.target.closest('button.play'); if(b) load(b); });

/* featured reel in hero */
const fb = el('button',{class:'play','data-t':'y','data-id':FEATURED,'aria-label':'Play featured reel'},'<span class="btn"></span>');
fb.style.backgroundImage='url(https://i.ytimg.com/vi/'+FEATURED+'/hqdefault.jpg)';
document.getElementById('feature').appendChild(fb);
